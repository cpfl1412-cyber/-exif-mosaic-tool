<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아이폰 미리보기</title>
<style>
  html, body { margin: 0; padding: 0; background: #0d1521; }
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; gap: 40px; padding: 40px 20px; }
  .phone {
    position: relative;
    width: 393px; height: 852px;
    border-radius: 54px;
    background: #1b2430;
    padding: 12px;
    box-shadow: 0 0 0 2px #33415a, 0 30px 60px -20px rgba(0,0,0,.8);
    flex: none;
  }
  .screen {
    position: relative;
    width: 100%; height: 100%;
    border-radius: 44px;
    overflow: hidden;
    background: #f2f5fa;
  }
  iframe { width: 100%; height: 100%; border: 0; display: block; }
  .notch {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    width: 112px; height: 30px; border-radius: 18px; background: #10171f; z-index: 3;
  }
  .caption { color: #93a6c1; font: 500 14px/1.6 -apple-system, "Apple SD Gothic Neo", sans-serif; max-width: 380px; }
  .caption b { color: #e8f0fb; font-size: 18px; display: block; margin-bottom: 6px; }
</style>
</head>
<body>
  <div class="phone">
    <div class="notch"></div>
    <div class="screen"><iframe src="./index.html" title="사진 안전 정리 모바일 화면"></iframe></div>
  </div>
  <div class="caption">
    <b>아이폰 홈 화면에 추가</b>
    Safari로 열고 공유 → “홈 화면에 추가”를 누르면 앱처럼 전체 화면으로 열립니다.<br>
    사진은 폰 밖으로 나가지 않습니다.
  </div>
</body>
</html>
